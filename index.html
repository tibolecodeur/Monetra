<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- Couleur de la barre d'état : celle du haut de la page (mise à jour par lib/prefs.ts au changement de thème). -->
    <meta name="theme-color" content="#070609" />
    <meta name="description" content="Monetra : gestion de finances personnelles, 100 % locale." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Monetra" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>Monetra</title>
    <script>
      // Thème choisi dans Réglages (sombre, clair ou automatique), appliqué avant le premier rendu (sombre par défaut).
      try {
        var theme = localStorage.getItem('monetra:theme')
        var light = theme === 'light' || (theme === 'auto' && matchMedia('(prefers-color-scheme: light)').matches)
        if (light) {
          document.documentElement.dataset.theme = 'light'
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f4f2f8')
        }
        // Mode discret : les montants arrivent déjà floutés, jamais en clair au lancement.
        if (localStorage.getItem('monetra:private') === '1') document.documentElement.setAttribute('data-private', '')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
